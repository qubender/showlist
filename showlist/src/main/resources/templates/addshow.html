<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Show</title>
</head>
<body>
    <h1>Add Show</h1>
    <form th:action="@{/save}" th:object="${shows}" method="post">
    <table>
        <tr>
            <td>First aired <input type="text" th:field="*{firstAired}" />
            <div th:if="${#fields.hasErrors('firstAired')}" th:errors="*{firstAired}"></div></td>
            <td>Creator <input type="text" th:field="*{creators}" />
            <div th:if="${#fields.hasErrors('creators')}" th:errors="*{creators}"></div></td>
            <td>Title <input type="text" th:field="*{title}" />
            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div></td>
            <td>IMDB-rating <input type="text" th:field="*{imdbRating}" /></td>
            <td>Watched <input type="text" th:field="*{watched}" />
            <div th:if="${#fields.hasErrors('watched')}" th:errors="*{watched}"></div></td>
            <td>My rating <input type="text" th:field="*{myRating}" />
            <div th:if="${#fields.hasErrors('myRating')}" th:errors="*{myRating}"></div></td>
        </tr>
    </table>
    <button type="submit">Add</button>
    </form>
</body>
</html>
