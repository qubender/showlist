<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form th:action="@{/login}" th:object="${appUser}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus="autofocus" /> <br />
        <div class="alert alert-warning" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        <label for="passwordHash">Password</label>
        <input type="passwordHash" id="passwordHash" name="passwordHash" /> <br />
        <div class="alert alert-warning" th:if="${#fields.hasErrors('passwordHash')}" th:errors="*{passwordHash}"></div>
        <input type="submit" value="Log in" />
    </form>
</body>
</html>
